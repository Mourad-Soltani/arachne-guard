[project]
name = "arachne-guard"
version = "0.4.0"
description = "Identity, permissions, consent and tamper-evident audit for AI agents (MCP / A2A)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mourad Soltani" }
]
keywords = [
    "ai-agents",
    "mcp",
    "a2a",
    "security",
    "identity",
    "authorization",
    "audit",
    "ed25519",
    "tool-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/mouradsoltani/arachne-guard"
Documentation = "https://github.com/mouradsoltani/arachne-guard#readme"
Repository = "https://github.com/mouradsoltani/arachne-guard"
Issues = "https://github.com/mouradsoltani/arachne-guard/issues"
Changelog = "https://github.com/mouradsoltani/arachne-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arachne_guard"]

[tool.setuptools.package-data]
arachne_guard = ["py.typed"]
